# Render Blueprint Specification for TemplaFill Backend
# Reference: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: templafill-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # AUDIT-01: --no-proxy-headers stops uvicorn from rewriting request.client
    # with the attacker-controlled leftmost X-Forwarded-For entry. The app then
    # resolves the client IP itself: CF-Connecting-IP (set by Cloudflare at
    # Render's edge) → rightmost XFF hop → X-Real-IP → socket peer.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      # Exact allowed origins only — set your deployed frontend URL(s) here.
      - key: CORS_ORIGINS
        value: "http://localhost:3000"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      # ----- Security hardening -----
      - key: REQUIRE_SESSION_TOKEN
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: "none"
      # AUDIT-01: the service is only reachable through Render's load balancer,
      # so every direct peer is a trusted proxy. get_client_ip() then prefers
      # CF-Connecting-IP (set by Cloudflare at Render's edge) and falls back to
      # the RIGHT-most X-Forwarded-For hop. Leftmost attacker-supplied entries
      # are ignored.
      - key: TRUSTED_PROXIES
        value: "*"
      - key: MAX_REQUEST_BODY_MB
        value: "90"
      - key: MAX_CONCURRENT_JOBS
        value: "100"
      # ----- Tier system — account tier (Phase 6, ADR-020) -----
      # Login stays disabled (503) until the scrypt hash is set — see scripts/hash_password.py
      - key: TIER_ACCOUNT_USERNAME
        value: account
      - key: TIER_ACCOUNT_PASSWORD_HASH
        sync: false
      - key: TIER_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: FREE_JOBS_PER_DAY
        value: "5"
      - key: PRO_JOBS_PER_DAY
        value: "50"
      # ----- DeepSeek (account tier — zero Google calls) -----
      # DEEPSEEK_API_KEY is a kenari.id gateway key (kn-...) in this deployment;
      # any OpenAI-compatible endpoint works. Base URL must NOT include /v1
      # (the code appends /v1/chat/completions). Model id must match the
      # gateway's catalog: kenari's id for DeepSeek-V4.1-Flash is
      # deepseek-v4-1-flash (DeepSeek's own API calls it deepseek-flash).
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-1-flash
      - key: DEEPSEEK_BASE_URL
        value: https://kenari.id
      # Disable hidden reasoning tokens during extraction (fast, cheaper, avoids
      # the 35s timeout on large contracts). Set false if the provider rejects it.
      - key: DEEPSEEK_DISABLE_THINKING
        value: "true"
