# Render Blueprint Specification for TemplaFill Backend
# Reference: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: templafill-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      # Exact allowed origins only — set your deployed frontend URL(s) here.
      - key: CORS_ORIGINS
        value: "http://localhost:3000"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      # ----- Security hardening -----
      - key: REQUIRE_SESSION_TOKEN
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: "none"
      # Set to Render's proxy egress IP ranges that appear in X-Forwarded-For.
      - key: TRUSTED_PROXIES
        sync: false
      - key: MAX_REQUEST_BODY_MB
        value: "90"
      - key: MAX_CONCURRENT_JOBS
        value: "100"
