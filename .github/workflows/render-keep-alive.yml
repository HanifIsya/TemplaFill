name: Render Backend Keep-Alive

on:
  schedule:
    # Run every 10 minutes (cron format: minute hour day month day-of-week)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          BACKEND_URL="${{ secrets.RENDER_BACKEND_URL || 'https://templafill-backend.onrender.com' }}"
          echo "Pinging $BACKEND_URL/api/health to prevent Render free-tier sleep..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$BACKEND_URL/api/health" || true)
          echo "$RESPONSE"
          echo "Keep-alive ping completed successfully."
